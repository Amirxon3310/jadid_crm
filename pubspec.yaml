name: jadid_crm
description: Jadid oquv markazi uchun sodda Flutter CRM
publish_to: none
version: 0.3.0+3
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.17.2
  cupertino_icons: 1.0.9
  image_picker: 1.2.1
  web: 1.1.1
  shared_preferences: ^2.5.5
  file_picker: ^13.0.0
  url_launcher: ^6.3.2
  go_router: ^17.5.0
dev_dependencies:
  http: 1.6.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    # Shown verbatim by the setup notice, so the SQL an admin copies is the
    # migration itself rather than a copy that can drift from it.
    - supabase/migrations/20260916140000_score_awards.sql
    - supabase/migrations/20260917060000_member_removal_and_answer_files.sql
    - supabase/migrations/20260917120000_homework_review_and_files.sql
    - supabase/migrations/20260916080000_frozen_enrollment.sql
    - supabase/migrations/20260916190000_group_plan_and_resubmit.sql
    - supabase/migrations/20260917200000_classmates_and_login.sql
    - supabase/migrations/20260917210000_classmate_results.sql
    - supabase/migrations/20260918090000_homework_file_delete.sql
  fonts:
    - family: SF Pro Display
      fonts:
        # Only the weights the app actually asks for. Flutter web ships every
        # declared font file to every visitor and cannot tree-shake them, and
        # the family's eighteen files come to 82 MB. Nothing uses italics, and
        # nothing asks for 100–300 or 900; those fall back if ever needed.
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
          weight: 400
        - asset: assets/fonts/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: assets/fonts/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: assets/fonts/SF-Pro-Display-Bold.otf
          weight: 700
        - asset: assets/fonts/SF-Pro-Display-Heavy.otf
          weight: 800
