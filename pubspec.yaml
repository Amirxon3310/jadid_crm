name: jadid_crm
description: Jadid oquv markazi uchun sodda Flutter CRM
publish_to: none
version: 0.3.0+3
environment:
  sdk: '>=3.9.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.17.2
  cupertino_icons: 1.0.9
  image_picker: 1.2.1
  web: 1.1.1
  shared_preferences: ^2.5.5
  file_picker: ^13.0.0
  url_launcher: ^6.3.2
  go_router: ^17.5.0
dev_dependencies:
  http: 1.6.0
  flutter_test:
    sdk: flutter
flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    # Shown verbatim by the setup notice, so the SQL an admin copies is the
    # migration itself rather than a copy that can drift from it.
    - supabase/migrations/20260916140000_score_awards.sql
    - supabase/migrations/20260917060000_member_removal_and_answer_files.sql
    - supabase/migrations/20260917120000_homework_review_and_files.sql
    - supabase/migrations/20260916080000_frozen_enrollment.sql
    - supabase/migrations/20260916190000_group_plan_and_resubmit.sql
    - supabase/migrations/20260917200000_classmates_and_login.sql
    - supabase/migrations/20260917210000_classmate_results.sql
    - supabase/migrations/20260918090000_homework_file_delete.sql
  fonts:
    - family: SF Pro Display
      fonts:
        - asset: assets/fonts/SF-Pro-Display-Ultralight.otf
          weight: 100
        - asset: assets/fonts/SF-Pro-Display-UltralightItalic.otf
          weight: 100
          style: italic
        - asset: assets/fonts/SF-Pro-Display-Thin.otf
          weight: 200
        - asset: assets/fonts/SF-Pro-Display-ThinItalic.otf
          weight: 200
          style: italic
        - asset: assets/fonts/SF-Pro-Display-Light.otf
          weight: 300
        - asset: assets/fonts/SF-Pro-Display-LightItalic.otf
          weight: 300
          style: italic
        - asset: assets/fonts/SF-Pro-Display-Regular.otf
          weight: 400
        - asset: assets/fonts/SF-Pro-Display-RegularItalic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/SF-Pro-Display-Medium.otf
          weight: 500
        - asset: assets/fonts/SF-Pro-Display-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/SF-Pro-Display-Semibold.otf
          weight: 600
        - asset: assets/fonts/SF-Pro-Display-SemiboldItalic.otf
          weight: 600
          style: italic
        - asset: assets/fonts/SF-Pro-Display-Bold.otf
          weight: 700
        - asset: assets/fonts/SF-Pro-Display-BoldItalic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/SF-Pro-Display-Heavy.otf
          weight: 800
        - asset: assets/fonts/SF-Pro-Display-HeavyItalic.otf
          weight: 800
          style: italic
        - asset: assets/fonts/SF-Pro-Display-Black.otf
          weight: 900
        - asset: assets/fonts/SF-Pro-Display-BlackItalic.otf
          weight: 900
          style: italic
